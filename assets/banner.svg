<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#text-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 4;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -120;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
  </style>

  <!-- Base Rectangle -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid -->
  <rect width="900" height="320" rx="16" fill="url(#grid)" />

  <!-- Background Dynamic Graphic Accent Elements (Low opacity, behind text) -->
  <g opacity="0.25">
    <circle cx="750" cy="80" r="140" fill="url(#accent-purple)" filter="url(#glow)" class="pulse-circle" />
    <circle cx="150" cy="260" r="100" fill="url(#accent-cyan)" filter="url(#glow)" />
    
    <!-- Dynamic Pipeline & Network Nodes -->
    <path d="M 550 240 Q 650 180 750 220 T 850 150" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <path d="M 520 270 Q 620 210 720 250 T 820 180" fill="none" stroke="#ec4899" stroke-width="1.5" class="flow-line" />

    <circle cx="550" cy="240" r="5" fill="#818cf8" />
    <circle cx="680" cy="200" r="7" fill="#c084fc" />
    <circle cx="750" cy="220" r="6" fill="#f472b6" />
    <circle cx="850" cy="150" r="8" fill="#38bdf8" />
  </g>

  <!-- Foreground Main Card Container -->
  <rect x="40" y="35" width="820" height="250" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Decorative Top Bar Accent -->
  <rect x="40" y="35" width="820" height="4" rx="2" fill="url(#accent-purple)" />

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(70, 95)">
    <!-- Emoji / Icon Badge -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <text x="22" y="29" font-size="22" text-anchor="middle">🚀</text>

    <!-- Main Title -->
    <text x="60" y="32" class="title-text">Awesome Sales AI Assistant</text>
    
    <!-- Subtitle -->
    <text x="60" y="65" class="subtitle-text">Curated Revenue Intelligence, Autonomous SDRs &amp; Conversation AI Ecosystem</text>
  </g>

  <!-- Foreground Tech Badges / Pills -->
  <g transform="translate(130, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="32" rx="16" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1"/>
    <text x="72.5" y="20" class="badge-text" text-anchor="middle">⚡ Autonomous SDRs</text>

    <!-- Pill 2 -->
    <rect x="157" y="0" width="165" height="32" rx="16" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="1"/>
    <text x="239.5" y="20" class="badge-text" text-anchor="middle">📊 Revenue Intelligence</text>

    <!-- Pill 3 -->
    <rect x="334" y="0" width="145" height="32" rx="16" fill="rgba(236, 72, 153, 0.25)" stroke="#ec4899" stroke-width="1"/>
    <text x="406.5" y="20" class="badge-text" text-anchor="middle">🎙️ Call Analytics</text>

    <!-- Pill 4 -->
    <rect x="491" y="0" width="155" height="32" rx="16" fill="rgba(14, 165, 233, 0.25)" stroke="#0ea5e9" stroke-width="1"/>
    <text x="568.5" y="20" class="badge-text" text-anchor="middle">🤖 Open-Source AI</text>
  </g>
</svg>
